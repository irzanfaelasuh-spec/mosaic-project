name: Deploy MOSAIC Gemini backend
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["backend/**", ".github/workflows/deploy-ai.yml"]
permissions:
  contents: read
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}
      - uses: google-github-actions/setup-gcloud@v2
        with:
          project_id: ${{ secrets.GCP_PROJECT_ID }}
      - name: Store API key and app token in Secret Manager
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          MOSAIC_CLIENT_TOKEN: ${{ secrets.MOSAIC_CLIENT_TOKEN }}
        run: |
          set -euo pipefail
          test -n "$GEMINI_API_KEY"
          test -n "$MOSAIC_CLIENT_TOKEN"
          printf '%s' "$GEMINI_API_KEY" | gcloud secrets create gemini-api-key --replication-policy=automatic --data-file=- 2>/dev/null || printf '%s' "$GEMINI_API_KEY" | gcloud secrets versions add gemini-api-key --data-file=-
          printf '%s' "$MOSAIC_CLIENT_TOKEN" | gcloud secrets create mosaic-client-token --replication-policy=automatic --data-file=- 2>/dev/null || printf '%s' "$MOSAIC_CLIENT_TOKEN" | gcloud secrets versions add mosaic-client-token --data-file=-
      - name: Grant Cloud Run runtime access to secrets
        env:
          PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
        run: |
          set -euo pipefail
          PROJECT_NUMBER="$(gcloud projects describe "$PROJECT_ID" --format='value(projectNumber)')"
          RUNTIME_SA="${PROJECT_NUMBER}-compute@developer.gserviceaccount.com"
          for SECRET in gemini-api-key mosaic-client-token; do
            gcloud secrets add-iam-policy-binding "$SECRET" \
              --member="serviceAccount:${RUNTIME_SA}" \
              --role="roles/secretmanager.secretAccessor" --quiet
          done
          echo "RUNTIME_SA=${RUNTIME_SA}" >> "$GITHUB_ENV"
      - name: Deploy to Cloud Run
        env:
          REGION: ${{ secrets.GCP_REGION }}
        run: |
          set -euo pipefail
          gcloud run deploy mosaic-gemini-proxy \
            --source backend \
            --region "${REGION:-asia-southeast2}" \
            --service-account="$RUNTIME_SA" \
            --allow-unauthenticated \
            --set-secrets=GEMINI_API_KEY=gemini-api-key:latest,MOSAIC_CLIENT_TOKEN=mosaic-client-token:latest \
            --memory=512Mi --cpu=1 --concurrency=8 --max-instances=3
